name: CI/CD with OIDC

on:
  pull_request:
    branches: [ "main" ]

  push:
    branches: [ "main" ]

permissions:
  id-token: write   # REQUIRED for OIDC
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: ${{ secrets.ECR_REPO }}

jobs:

# 🔹 1. TEST JOB
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install Dependencies
      run: pip install -r requirements.txt pytest

    - name: Run Tests
      run: pytest || true


# 🔹 2. BUILD & PUSH TO ECR
  build_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # ✅ OIDC AUTH
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to ECR
      run: |
        aws ecr get-login-password --region $AWS_REGION \
        | docker login --username AWS --password-stdin $ECR_REPO

    - name: Build Docker Image
      run: docker build -t devops-app .

    - name: Tag Image
      run: docker tag devops-app:latest $ECR_REPO:latest

    - name: Push Image
      run: docker push $ECR_REPO:latest


# 🔹 3. DEPLOY TO STAGING (EC2)
  deploy_staging:
    runs-on: ubuntu-latest
    needs: build_push

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          # 🔧 Set variables inside EC2
          ECR_REPO=${{ secrets.ECR_REPO }}
          REGION=${{ secrets.AWS_REGION }}

          # 🔐 Login to ECR (IMPORTANT FIX)
          aws ecr get-login-password --region $REGION \
          | docker login --username AWS --password-stdin $ECR_REPO

          # 🚀 Deploy container
          docker pull $ECR_REPO:latest
          docker stop app || true
          docker rm app || true
          docker run -d -p 80:80 --name app $ECR_REPO:latest


# 🔹 4. PRODUCTION (MANUAL APPROVAL)
  deploy_production:
    runs-on: ubuntu-latest
    needs: deploy_staging
    environment: production   # 👈 Manual approval

    steps:
    - name: Deploy to Production
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          ECR_REPO=${{ secrets.ECR_REPO }}
          REGION=${{ secrets.AWS_REGION }}

          aws ecr get-login-password --region $REGION \
          | docker login --username AWS --password-stdin $ECR_REPO

          docker pull $ECR_REPO:latest
          docker stop app || true
          docker rm app || true
          docker run -d -p 80:80 --name app $ECR_REPO:latest